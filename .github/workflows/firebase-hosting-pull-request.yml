# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    # Only build a preview for PRs that target the long-lived branches and
    # actually touch the frontend — matches deploy.yml/frontend-check.yml and
    # avoids redundant Firebase preview deploys on backend-only / feature→feature PRs.
    branches: [main, develop]
    paths: ['frontend/**']
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # firebaseToolsVersion is pinned to 15.20.0 (the last release before the
      # regression). firebase-tools 15.21.0+ fails its OAuth token fetch under the
      # GitHub runner's Node 24.17 ("Premature close" -> "Failed to authenticate"),
      # because a Node 24.17 http.Agent change exposes a node-fetch bug
      # (firebase-tools#10692, nodejs/node#63989). Without this pin the action runs
      # `npx firebase-tools@latest`, which currently resolves to a broken version.
      # Drop the pin once firebase-tools ships a fix.
      - uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIFEELNEWS_FRONT }}
          firebaseToolsVersion: "15.20.0"
          projectId: aifeelnews-front
          entryPoint: frontend
