name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    # Only build a preview for PRs that target the long-lived branches and
    # actually touch the frontend — matches deploy.yml/frontend-check.yml and
    # avoids redundant Firebase preview deploys on backend-only / feature→feature PRs.
    branches: [main, develop]
    paths: ['frontend/**']
  # Manual run to validate the deploy path on CI-only changes (no PR number, so
  # it uses a named channel instead of pr-<n>).
  workflow_dispatch:
    inputs:
      channelId:
        description: "Preview channel to deploy to"
        required: false
        default: "manual"
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    # On pull_request, restrict to same-repo non-Dependabot PRs (secrets aren't
    # available to forks/Dependabot anyway). On workflow_dispatch there is no PR
    # context, so allow it through.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Node 24.17 (runner default) breaks the Firebase OAuth fetch; 24.18.0 fixes it.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # 15.22.3 disables keep-alive in google-auth-library, fixing the same OAuth
      # break for service-account auth (firebase-tools#10716, nodejs/node#63989).
      - uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIFEELNEWS_FRONT }}
          firebaseToolsVersion: "15.22.3"
          # Empty on PRs (action auto-derives pr-<n>); set on manual dispatch.
          channelId: ${{ github.event.inputs.channelId }}
          projectId: aifeelnews-front
          entryPoint: frontend
