name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    # Only build a preview for PRs that target the long-lived branches and
    # actually touch the frontend — matches deploy.yml/frontend-check.yml and
    # avoids redundant Firebase preview deploys on backend-only / feature→feature PRs.
    branches: [main, develop]
    paths: ['frontend/**']
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # Pinned to the merged-but-unreleased Node 24 fix (PR #450) rather than the
      # latest tag v0.10.0, which still declares `using: node20`. GitHub force-runs
      # node20 actions on Node 24, and firebase-tools' OAuth token fetch fails under
      # Node 24 ("Premature close" -> "Failed to authenticate"; firebase-tools#10692).
      # Revert to a normal tag pin once a release ships (action-hosting-deploy#457).
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # PR #450 (node24)
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIFEELNEWS_FRONT }}
          projectId: aifeelnews-front
          entryPoint: frontend
