name: Deploy to Cloud Run

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Serialize runs per ref so two in-flight deploys cannot interleave the prod
# Alembic migration and the Cloud Run traffic split (which would produce a
# nondeterministic serving revision and fight the rollback step). Do NOT cancel
# an in-progress run: a deploy mid-migration must finish before the next starts.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: aifeelnews-prod
  SERVICE: aifeelnews-web
  REGION: europe-west1
  AR_REGISTRY: europe-west1-docker.pkg.dev/aifeelnews-prod/aifeelnews

# Minimum permissions for the workflow. Individual jobs may add more (e.g.
# build-and-deploy needs id-token for OIDC and issues:write for the
# auto-failure-issue creator).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Postgres 14 to match prod Cloud SQL. Exercises the real migration chain
      # (views / PL-pgSQL functions / triggers) and the Postgres-only analytics
      # tests, which SQLite cannot run.
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aifeelnews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Enforce merge policy
      if: |
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        github.head_ref != 'develop' &&
        !startsWith(github.head_ref, 'fix/')
      run: |
        echo "::error::Only 'develop' or 'fix/*' branches can merge into main. Feature branches must target develop."
        exit 1

    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements-dev.txt pulls in requirements.txt plus the lint/type/test
        # toolchain (ruff, mypy, pytest) the steps below need.
        pip install -r requirements-dev.txt

    - name: Run code quality checks
      run: |
        python -m ruff check app/
        python -m mypy app/

    # Build the real schema (views / PL-pgSQL functions / triggers / indexes)
    # on the Postgres service so the @pytest.mark.postgres tests have something
    # to query. ENV=test keeps OIDC enforcement off; alembic only needs the URL.
    - name: Run database migrations (Postgres)
      run: |
        alembic upgrade head
      env:
        ENV: test
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aifeelnews_test

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
      env:
        # SQLite for the create_all `test_db` fixture and the TestClient tests.
        ENV: test
        DATABASE_URL: sqlite:///test.db
        # Postgres for the @pytest.mark.postgres tests; its presence un-skips them.
        TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/aifeelnews_test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker europe-west1-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile.web -t $AR_REGISTRY/$SERVICE:$GITHUB_SHA .
        docker tag $AR_REGISTRY/$SERVICE:$GITHUB_SHA $AR_REGISTRY/$SERVICE:latest

    - name: Push Docker image
      run: |
        docker push $AR_REGISTRY/$SERVICE:$GITHUB_SHA
        docker push $AR_REGISTRY/$SERVICE:latest

    # Run alembic against the production Cloud SQL instance via the Cloud SQL
    # Auth Proxy (TCP on 127.0.0.1:5432) using the same SA the Cloud Run
    # service uses. The DB password is pulled from Secret Manager at job time
    # so no DB credentials live in GitHub secrets.
    - name: Start Cloud SQL Auth Proxy
      run: |
        curl -sSL -o cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy
        ./cloud-sql-proxy --port=5432 \
          ${{ env.PROJECT_ID }}:${{ env.REGION }}:aifeelnews-db &
        for i in $(seq 1 15); do
          if nc -z 127.0.0.1 5432; then
            echo "Cloud SQL Proxy is listening"
            break
          fi
          [ $i -eq 15 ] && echo "::error::Cloud SQL Proxy failed to start" && exit 1
          sleep 1
        done

    # The runtime app uses the least-privileged ``aifeelnews`` user (table
    # DML only). Migrations need to CREATE INDEX, which requires ownership;
    # so we fetch the postgres superuser password here and use it for the
    # alembic step only. The runtime DATABASE_URL on Cloud Run still points
    # at ``aifeelnews`` via secretKeyRef — see the ``secrets:`` block below.
    - name: Fetch postgres superuser password from Secret Manager
      id: dbpass
      run: |
        PASSWORD=$(gcloud secrets versions access latest \
          --secret=db-password --project=${{ env.PROJECT_ID }})
        if [ -z "$PASSWORD" ]; then
          echo "::error::db-password secret is empty"
          exit 1
        fi
        echo "::add-mask::$PASSWORD"
        echo "password=$PASSWORD" >> $GITHUB_OUTPUT

    - name: Run database migrations
      run: |
        pip install -r requirements.txt
        alembic upgrade head
      env:
        ENV: production
        DATABASE_URL: postgresql://postgres:${{ steps.dbpass.outputs.password }}@127.0.0.1:5432/aifeelnews

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
      with:
        service: ${{ env.SERVICE }}
        region: ${{ env.REGION }}
        image: ${{ env.AR_REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }}
        # DATABASE_URL is a Secret Manager ref (see secrets: block); --add-cloudsql-instances mounts the socket the URL points at.
        env_vars: |
          ENV=production
          APP_VERSION=${{ github.sha }}
          GCP_PROJECT_ID=${{ env.PROJECT_ID }}
          SENTIMENT_PROVIDER=GCP_NL
          BIGQUERY_ENABLE_BIGQUERY=true
          # Comma in the value MUST be escaped: the deploy-cloudrun action treats
          # a bare comma as a separator between env vars, so `en,de` would set
          # MEDIASTACK_LANGUAGES=en (dropping `de`) and silently disable German
          # ingestion on every deploy. `\,` keeps it a single value.
          MEDIASTACK_LANGUAGES=en\,de
        secrets: |
          MEDIASTACK_API_KEY=mediastack-api-key:latest
          GCP_NLP_KEY_JSON=aifeelnews-gcp-nlp-key:latest
          FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account-json:latest
          DATABASE_URL=aifeelnews-database-url:latest
        flags: |
          --allow-unauthenticated
          --service-account=cloudrun-sa@aifeelnews-prod.iam.gserviceaccount.com
          --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:aifeelnews-db
          --memory=1Gi
          --cpu=1
          --min-instances=0
          --max-instances=10
          --concurrency=80
          --timeout=300

    - name: Verify deployment
      id: verify
      run: |
        URL="${{ steps.deploy.outputs.url }}"
        MAX_RETRIES=12
        RETRY_INTERVAL=5

        # 1. Wait for service readiness (handles cold-start from min-instances=0)
        echo "Waiting for service to be ready..."
        for i in $(seq 1 $MAX_RETRIES); do
          if curl -sf "$URL/health" > /dev/null 2>&1; then
            echo "Service is healthy (attempt $i/$MAX_RETRIES)"
            break
          fi
          if [ $i -eq $MAX_RETRIES ]; then
            echo "::error::Service failed to become healthy after $((MAX_RETRIES * RETRY_INTERVAL))s"
            exit 1
          fi
          echo "Attempt $i/$MAX_RETRIES failed, retrying in ${RETRY_INTERVAL}s..."
          sleep $RETRY_INTERVAL
        done

        # /version is hardcoded — check Cloud Run revision identity instead.
        SERVING_REV=$(gcloud run services describe $SERVICE --region=$REGION \
          --format='value(status.traffic[0].revisionName)')
        DEPLOYED_REV="${{ steps.deploy.outputs.revision }}"
        if [ -z "$DEPLOYED_REV" ]; then
          DEPLOYED_REV=$(gcloud run revisions list --service=$SERVICE \
            --region=$REGION --limit=1 \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)')
        fi
        if [ "$SERVING_REV" != "$DEPLOYED_REV" ]; then
          echo "::error::Revision mismatch: deployed $DEPLOYED_REV but $SERVING_REV is serving"
          exit 1
        fi
        echo "Revision verified: $SERVING_REV is serving 100% traffic"

        # 3. Verify metrics endpoint (confirms multi-table DB access)
        METRICS=$(curl -sf "$URL/metrics")
        if echo "$METRICS" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(1 if 'error' in d else 0)"; then
          echo "Metrics endpoint healthy"
        else
          echo "::error::Metrics endpoint returned an error"
          exit 1
        fi

        # 4. Verify the primary read API. An empty DB returns 200 with `[]`,
        # so curl -sf only fails on 404/5xx — safe to make this fatal so it
        # actually gates the rollback step instead of silently warning.
        if curl -sf "$URL/api/v1/articles/?skip=0&limit=1" > /dev/null; then
          echo "Articles API responding"
        else
          echo "::error::Articles API check failed"
          exit 1
        fi

        echo "All deployment checks passed"

    - name: Rollback on failure
      if: failure() && steps.deploy.outcome == 'success'
      run: |
        echo "Deployment verification failed — rolling back..."
        # Skip the just-deployed broken revision; status filter excludes
        # tagged-only previews that never went healthy.
        DEPLOYED_REV="${{ steps.deploy.outputs.revision }}"
        PREV_REV=$(gcloud run revisions list \
          --service=$SERVICE --region=$REGION \
          --filter="status.conditions.status=True AND metadata.name!=$DEPLOYED_REV" \
          --sort-by='~metadata.creationTimestamp' \
          --limit=1 --format='value(metadata.name)')
        if [ -n "$PREV_REV" ]; then
          gcloud run services update-traffic $SERVICE \
            --region=$REGION --to-revisions=$PREV_REV=100
          echo "Rolled back to revision: $PREV_REV"
          echo "## Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "Rolled back to revision: \`$PREV_REV\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "::warning::No previous revision found for rollback"
        fi

    - name: Deployment summary
      if: always()
      run: |
        echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Service** | \`$SERVICE\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Region** | \`$REGION\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | \`${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **URL** | ${{ steps.deploy.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

    - name: Create failure issue
      if: failure()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Deploy failed: ${context.sha.substring(0, 7)}`,
            body: `## Deployment Failure\n\n` +
              `**Commit:** ${context.sha}\n` +
              `**Branch:** ${context.ref}\n` +
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Please investigate and fix the issue.`,
            labels: ['deploy-failure']
          })
