name: Deploy to Cloud Run

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PROJECT_ID: aifeelnews-prod
  SERVICE: aifeelnews-web
  REGION: europe-west1
  AR_REGISTRY: europe-west1-docker.pkg.dev/aifeelnews-prod/aifeelnews

# Minimum permissions for the workflow. Individual jobs may add more (e.g.
# build-and-deploy needs id-token for OIDC and issues:write for the
# auto-failure-issue creator).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Enforce merge policy
      if: |
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        github.head_ref != 'develop' &&
        !startsWith(github.head_ref, 'fix/')
      run: |
        echo "::error::Only 'develop' or 'fix/*' branches can merge into main. Feature branches must target develop."
        exit 1

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run code quality checks
      run: |
        python -m ruff check app/
        python -m mypy app/

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
      env:
        # Set environment to test mode and provide database URL
        ENV: test
        DATABASE_URL: sqlite:///test.db

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read
      id-token: write
      issues: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker europe-west1-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile.web -t $AR_REGISTRY/$SERVICE:$GITHUB_SHA .
        docker tag $AR_REGISTRY/$SERVICE:$GITHUB_SHA $AR_REGISTRY/$SERVICE:latest

    - name: Push Docker image
      run: |
        docker push $AR_REGISTRY/$SERVICE:$GITHUB_SHA
        docker push $AR_REGISTRY/$SERVICE:latest

    # Run alembic against the production Cloud SQL instance via the Cloud SQL
    # Auth Proxy (TCP on 127.0.0.1:5432) using the same SA the Cloud Run
    # service uses. The DB password is pulled from Secret Manager at job time
    # so no DB credentials live in GitHub secrets.
    - name: Start Cloud SQL Auth Proxy
      run: |
        curl -sSL -o cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy
        ./cloud-sql-proxy --port=5432 \
          ${{ env.PROJECT_ID }}:${{ env.REGION }}:aifeelnews-db &
        for i in $(seq 1 15); do
          if nc -z 127.0.0.1 5432; then
            echo "Cloud SQL Proxy is listening"
            break
          fi
          [ $i -eq 15 ] && echo "::error::Cloud SQL Proxy failed to start" && exit 1
          sleep 1
        done

    - name: Fetch DB password from Secret Manager
      id: dbpass
      run: |
        PASSWORD=$(gcloud secrets versions access latest \
          --secret=db-password --project=${{ env.PROJECT_ID }})
        if [ -z "$PASSWORD" ]; then
          echo "::error::db-password secret is empty"
          exit 1
        fi
        echo "::add-mask::$PASSWORD"
        echo "password=$PASSWORD" >> $GITHUB_OUTPUT

    - name: Run database migrations
      run: |
        pip install -r requirements.txt
        alembic upgrade head
      env:
        ENV: production
        DATABASE_URL: postgresql://aifeelnews:${{ steps.dbpass.outputs.password }}@127.0.0.1:5432/aifeelnews

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE }}
        region: ${{ env.REGION }}
        image: ${{ env.AR_REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }}
        env_vars: |
          BIGQUERY_ENABLE_BIGQUERY=true
          ENV=production
          APP_VERSION=${{ github.sha }}
        secrets: |
          MEDIASTACK_API_KEY=mediastack-api-key:latest
        flags: |
          --allow-unauthenticated
          --service-account=cloudrun-sa@aifeelnews-prod.iam.gserviceaccount.com
          --memory=512Mi
          --cpu=1
          --min-instances=0
          --max-instances=10
          --concurrency=80
          --timeout=300

    - name: Verify deployment
      id: verify
      run: |
        URL="${{ steps.deploy.outputs.url }}"
        MAX_RETRIES=12
        RETRY_INTERVAL=5

        # 1. Wait for service readiness (handles cold-start from min-instances=0)
        echo "Waiting for service to be ready..."
        for i in $(seq 1 $MAX_RETRIES); do
          if curl -sf "$URL/health" > /dev/null 2>&1; then
            echo "Service is healthy (attempt $i/$MAX_RETRIES)"
            break
          fi
          if [ $i -eq $MAX_RETRIES ]; then
            echo "::error::Service failed to become healthy after $((MAX_RETRIES * RETRY_INTERVAL))s"
            exit 1
          fi
          echo "Attempt $i/$MAX_RETRIES failed, retrying in ${RETRY_INTERVAL}s..."
          sleep $RETRY_INTERVAL
        done

        # 2. Verify correct version deployed
        DEPLOYED_VERSION=$(curl -sf "$URL/version" | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
        if [ "$DEPLOYED_VERSION" != "$GITHUB_SHA" ]; then
          echo "::error::Version mismatch: expected $GITHUB_SHA, got $DEPLOYED_VERSION"
          exit 1
        fi
        echo "Version verified: $DEPLOYED_VERSION"

        # 3. Verify metrics endpoint (confirms multi-table DB access)
        METRICS=$(curl -sf "$URL/metrics")
        if echo "$METRICS" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(1 if 'error' in d else 0)"; then
          echo "Metrics endpoint healthy"
        else
          echo "::error::Metrics endpoint returned an error"
          exit 1
        fi

        # 4. Verify primary API router
        if curl -sf "$URL/api/v1/articles/?skip=0&limit=1" > /dev/null 2>&1; then
          echo "Articles API responding"
        else
          echo "::warning::Articles API check failed (may be empty DB — non-fatal)"
        fi

        echo "All deployment checks passed"

    - name: Rollback on failure
      if: failure() && steps.deploy.outcome == 'success'
      run: |
        echo "Deployment verification failed — rolling back..."
        PREV_REV=$(gcloud run revisions list \
          --service=$SERVICE --region=$REGION \
          --limit=2 --format='value(REVISION)' | tail -1)
        if [ -n "$PREV_REV" ]; then
          gcloud run services update-traffic $SERVICE \
            --region=$REGION --to-revisions=$PREV_REV=100
          echo "Rolled back to revision: $PREV_REV"
          echo "## Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "Rolled back to revision: \`$PREV_REV\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "::warning::No previous revision found for rollback"
        fi

    - name: Deployment summary
      if: always()
      run: |
        echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Service** | \`$SERVICE\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Region** | \`$REGION\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | \`${GITHUB_SHA::7}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **URL** | ${{ steps.deploy.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

    - name: Create failure issue
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Deploy failed: ${context.sha.substring(0, 7)}`,
            body: `## Deployment Failure\n\n` +
              `**Commit:** ${context.sha}\n` +
              `**Branch:** ${context.ref}\n` +
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Please investigate and fix the issue.`,
            labels: ['deploy-failure']
          })
