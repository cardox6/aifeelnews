name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: aifeelnews-prod
  SERVICE: aifeelnews-web
  REGION: europe-west1
  AR_REGISTRY: europe-west1-docker.pkg.dev/aifeelnews-prod/aifeelnews

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run code quality checks
      run: |
        python -m ruff check app/
        python -m mypy app/

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
      env:
        # Set environment to test mode and provide database URL
        ENV: test
        DATABASE_URL: sqlite:///test.db

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker europe-west1-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile.web -t $AR_REGISTRY/$SERVICE:$GITHUB_SHA .
        docker tag $AR_REGISTRY/$SERVICE:$GITHUB_SHA $AR_REGISTRY/$SERVICE:latest

    - name: Push Docker image
      run: |
        docker push $AR_REGISTRY/$SERVICE:$GITHUB_SHA
        docker push $AR_REGISTRY/$SERVICE:latest

    - name: Deploy to Cloud Run
      id: deploy
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE }}
        region: ${{ env.REGION }}
        image: ${{ env.AR_REGISTRY }}/${{ env.SERVICE }}:${{ github.sha }}
        env_vars: |
          BIGQUERY_ENABLE_BIGQUERY=true
          ENV=production
        secrets: |
          MEDIASTACK_API_KEY=mediastack-api-key:latest
        flags: |
          --allow-unauthenticated
          --service-account=cloudrun-sa@aifeelnews-prod.iam.gserviceaccount.com
          --memory=512Mi
          --cpu=1
          --min-instances=0
          --max-instances=10
          --concurrency=80
          --timeout=300

    - name: Show deployment URL
      run: echo "Deployed to ${{ steps.deploy.outputs.url }}"

    - name: Test deployment health
      run: |
        sleep 10  # Wait for service to be ready
        curl -f ${{ steps.deploy.outputs.url }}/health || exit 1
        echo "✅ Deployment health check passed"
