services:
  # Web API Service
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: aifeelnews-web
    ports:
      # Host :8002 → container :8080. Host is :8002 (not :8080) to sidestep
      # a local Apache/XAMPP that commonly squats on :8080 on Windows dev
      # boxes. The container, Cloud Run, and the prod compose file all stay
      # on :8080 — only the host-side mapping diverges for local dev.
      - "8002:8080"
    environment:
      - PORT=8080
      - ENV=development
    env_file:
      - .env
    depends_on:
      # Wait for Postgres to be HEALTHY (accepting connections), not merely
      # started. web runs `alembic upgrade head` on boot; a short-form
      # depends_on lets it fire during Postgres' initdb window and fail on
      # connection-refused, leaving web down (it has no restart policy).
      db:
        condition: service_healthy
    volumes:
      - .:/app  # For development hot reload
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"]

  # Background Worker Service
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: aifeelnews-worker
    environment:
      - ENV=development
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # For development
    restart: unless-stopped

  # Scheduled Ingestion Service
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    container_name: aifeelnews-scheduler
    environment:
      - ENV=development
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # For development
    restart: unless-stopped

  # Database Service
  db:
    image: postgres:14@sha256:a209aced4fa19381231fae4d9a4c5816f7691294f13572f8bddc082ba32e1c7c
    container_name: aifeelnews-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aifeelnews}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aifeelnews}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
