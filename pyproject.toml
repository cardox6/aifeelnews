[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Temporarily relaxed for FastAPI
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Temporarily relaxed during cleanup
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Exclude migrations, test files, and dev scripts from strict checking
exclude = [
    "alembic/.*",
    "tests/.*",
    "scripts/.*"
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/__pycache__/*",
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]
